name: Validate examples

# Validates every JSON document under examples/ against the spec's JSON Schema
# via kg-validate-action. Each example is dispatched to the matching renderer
# based on its top-level version field, then ajv-checked against the bundled
# JSON Schema 2020-12 document.
#
# Fails the PR if any example regresses against the schema.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-examples:
    name: Validate against Kinetic Gain Protocol Suite schemas
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - uses: mizcausevic-dev/kg-validate-action@88ec89cd265205cc0a0e58d13d3fa93a5ca18898 # v0.1.0
        with:
          files: 'examples/**/*.json'
